name: Build release APK

on:
  push:
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Determine Gradle version
        id: gv
        run: |
          v=""
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            v=$(sed -n 's#.*gradle-\([0-9][0-9.]*\)-\(bin\|all\)\.zip.*#\1#p' gradle/wrapper/gradle-wrapper.properties | head -n1)
          fi
          echo "version=${v:-8.9}" >> "$GITHUB_OUTPUT"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gv.outputs.version }}

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$GITHUB_WORKSPACE/shadealpha-release.jks"
          {
            echo "storeFile=$GITHUB_WORKSPACE/shadealpha-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "--- keystore.properties (без паролей) ---"
          grep storeFile keystore.properties
          grep keyAlias keystore.properties

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Sign and verify APK
        id: apk
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          src=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          bt=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)
          apksigner="$ANDROID_HOME/build-tools/$bt/apksigner"
          name="ShadeAlpha-${GITHUB_REF_NAME}.apk"
          "$apksigner" sign \
            --ks "$GITHUB_WORKSPACE/shadealpha-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$name" "$src"
          certs=$("$apksigner" verify --verbose --print-certs "$name")
          echo "$certs"
          if echo "$certs" | grep -qi "Android Debug"; then
            echo "::error::APK подписан debug-ключом!"
            exit 1
          fi
          echo "path=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ShadeAlpha-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true