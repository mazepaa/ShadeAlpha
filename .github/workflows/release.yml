name: Build release APK

on:
  push:
    tags: ['*']
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK build type"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

env:
  BUILD_TYPE: ${{ inputs.build_type || 'release' }}

jobs:
  build:
    name: Build ShadeAlpha APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT/cmdline-tools" ]; then
            echo "Android SDK or cmdline-tools not found on this runner"
            env | grep -E 'ANDROID_(HOME|SDK_ROOT)' || true
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          LICENSE_STATUS=$?
          set -o pipefail
          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "Android SDK license acceptance failed (exit $LICENSE_STATUS)"
            exit "$LICENSE_STATUS"
          fi

          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare release signing key
        if: inputs.build_type != 'debug'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing GitHub Actions secret KEYSTORE_BASE64"
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/shadealpha-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          echo "Release keystore prepared."

      - name: Build APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/shadealpha-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew --no-daemon assembleDebug
          else
            for name in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
              if [ -z "${!name:-}" ]; then
                echo "::error::Missing GitHub Actions secret $name"
                exit 1
              fi
            done
            ./gradlew --no-daemon assembleRelease
          fi

      - name: Name APK after the version
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          if [ "$BUILD_TYPE" = "debug" ]; then
            src="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          else
            src="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          fi
          if [ -z "$src" ]; then
            echo "::error::APK not found"
            exit 1
          fi

          version="$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)"
          if [ -z "$version" ]; then
            echo "::error::versionName not found in app/build.gradle"
            exit 1
          fi

          suffix=""
          if [ "$BUILD_TYPE" = "debug" ]; then suffix="-debug"; fi
          name="ShadeAlpha-${version}${suffix}.apk"
          cp "$src" "$name"
          echo "path=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify release APK signature
        if: inputs.build_type != 'debug'
        shell: bash
        run: |
          set -euo pipefail
          bt="$ANDROID_HOME/build-tools/36.0.0"
          [ -d "$bt" ] || bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          "$bt/apksigner" verify --print-certs "${{ steps.apk.outputs.path }}" | tee verify.txt
          if grep -qi "Android Debug" verify.txt; then
            echo "::error::APK is signed with the debug key"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadeAlpha-${{ steps.apk.outputs.version }}-${{ env.BUILD_TYPE }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.apk.outputs.path }}
